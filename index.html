const t = document.getElementById('t'), q = document.getElementById('q'), c = document.getElementById('count');
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){
  const term = q.value.toLowerCase().trim();
  const parts = term.split(/\s+/);
  const rows = DATA.filter(r=>{
    const hay = (r.n+' '+r.d+' '+r.l).toLowerCase();
    return parts.every(p=>hay.includes(p));
  });
  c.textContent = rows.length+' of '+DATA.length+' repos';
  t.innerHTML = rows.map(r=>`<tr${r.a?' class="archived"':''}><td class="n"><a href="${r.url}">${esc(r.n)}</a>${r.a?' <tag>archived</tag>':''}</td><td class="d">${r.d||''}</td><td>${esc(r.l)}</td><td>${r.u}</td><td>${r.s||''}</td></tr>`).join('');
}
q.addEventListener('input',render);
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
render();
